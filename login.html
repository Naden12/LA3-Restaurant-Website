<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <body class="flex justify-center items-center h-screen bg-gray-100 dark:bg-gray-900">

<form class="bg-white dark:bg-gray-800 p-8 rounded shadow w-80">
  <h2 class="text-2xl mb-5">Login</h2>

  <input type="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
  <input type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded">

  <button class="w-full bg-blue-500 text-white py-2 rounded">
    Login
  </button>

</form>

</body>
<script>
    // On page load or when changing themes, best to add inline in `head`to avoid FOUC
    document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches),
    );

    // function for darkmode
    function DarkModeAction() {
        window.location.reload();
        document.documentElement.classList.add = "light";
        localStorage.theme = "dark";
    }

    // function for lightmode
    function LightModeAction() {
        window.location.reload();
        document.documentElement.classList.remove = "dark";
        localStorage.theme = "light";
    }

</script>

</html>
